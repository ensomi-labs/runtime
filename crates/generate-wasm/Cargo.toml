[package]
name = "ensomi-generate-wasm"
description = "WebAssembly binding for the Ensomi chart generator; the caller runs the graphs with ONNX Runtime Web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ensomi-gameplay = { path = "../gameplay" }
ensomi-generate = { path = "../generate" }
js-sys = "0.3"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
wasm-bindgen = "=0.2.129"
