name: CI

on:
  # Branches only: a release tag runs these checks through release.yml.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  RUST_VERSION: 1.99.0
  WASM_BINDGEN_VERSION: 0.2.129
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests, with the gameplay conformance fixtures
        run: cargo test --locked --workspace

  wasm:
    name: Wasm build and npm pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and wasm-bindgen
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          name="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$name.tar.gz" \
            | tar -xz -C ~/.cargo/bin --strip-components 1 "$name/wasm-bindgen"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run build
        working-directory: js
      - run: npm pack
        working-directory: js
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: js/ensomi-runtime-*.tgz
          if-no-files-found: error

  apple:
    name: xcframework and Swift package
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target aarch64-apple-darwin --target aarch64-apple-ios --target aarch64-apple-ios-sim
          rustup default "$RUST_VERSION"
      - run: scripts/build-apple.sh
      - name: The checked-in Swift bindings match the library
        run: git diff --exit-code swift/Sources
      - name: Swift tests (the generator tests skip without the model)
        run: swift test
        env:
          ENSOMI_RUNTIME_XCFRAMEWORK: build/apple/EnsomiRuntimeFFI.xcframework
      - name: Zip the xcframework
        run: ditto -c -k --sequesterRsrc --keepParent build/apple/EnsomiRuntimeFFI.xcframework build/apple/EnsomiRuntimeFFI.xcframework.zip
      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: build/apple/EnsomiRuntimeFFI.xcframework.zip
          if-no-files-found: error
